name: Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: [ backend, frontend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action's type=sha emits the SHORT commit sha
      # (sha-<7 chars>) — resolve it once and share it between steps
      # (action inputs do no shell expansion).
      - name: Resolve image reference
        id: imageref
        run: echo "ref=ghcr.io/${{ github.repository }}-${{ matrix.image }}:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # GHCR is eventually consistent: a push can take tens of seconds to
      # become visible via the registry API (MANIFEST_UNKNOWN). Retry instead
      # of letting the scan fail on a freshly-pushed tag.
      - name: Wait for image to propagate on GHCR
        run: |
          img="${{ steps.imageref.outputs.ref }}"
          for i in $(seq 1 30); do
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "image visible after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "image $img never became visible"; exit 1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.imageref.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'   # fail the build on HIGH/CRITICAL findings
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        # Best-effort: requires Code scanning enabled in repo settings
        # (Settings → Code security → Code scanning). Without it the upload
        # is refused ("not enabled") — the Trivy gate above already failed
        # the run on any HIGH/CRITICAL finding, so this step is reporting
        # only and must not turn the run red on its own.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  compose-smoke:
    # Serialized after scan: running alongside two Trivy scans + builds on
    # the same runner starved the backend of CPU and it missed the health
    # window (2 failures in 3 runs).
    needs: [build-and-push, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare backend env (throwaway key, no secrets)
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 16)" > backend/.env
          echo "OPENROUTER_API_KEY=" >> backend/.env

      - name: Start the stack
        run: |
          docker compose up -d || { docker compose logs backend; exit 1; }

      - name: Wait for health
        # GH runner networking is occasionally transient (curl exit 56 = recv
        # failure) even when the container reports Healthy — retry the final
        # probe before giving up and dumping logs.
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "backend never became healthy"; docker compose logs backend; exit 1; fi
          # Post-health retry window for transient connection resets.
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 3
          done
          curl -sf http://localhost:3001/health || { docker compose logs backend; exit 1; }
          curl -sf -o /dev/null http://localhost:8080 || { docker compose logs frontend; exit 1; }

      - name: Smoke — first registration becomes admin, login, run a simulation
        run: |
          curl -sf -X POST http://localhost:3001/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_admin","password":"CiAdminPass123"}' | grep '"role":"admin"'
          curl -sf -c /tmp/ci-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_admin","password":"CiAdminPass123"}'
          curl -sf -b /tmp/ci-cookies.txt -X POST http://localhost:3001/api/simulation/start \
            -H 'Content-Type: application/json' \
            -d '{"initialBalance":10000,"frequency":"Low","dataMode":"SIM"}'
          sleep 3
          curl -sf -b /tmp/ci-cookies.txt http://localhost:3001/api/simulation/status | grep '"isRunning":true'
          curl -sf http://localhost:3001/metrics | grep -E 'aegis_(http_requests_total|agent_running)'

      - name: Tear down
        if: always()
        run: docker compose down -v
