name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Extract changelog for this tag
      id: changelog
      # Grab the newest "## [x]" section from CHANGELOG.md (the unreleased
      # heading plus everything up to the next version heading).
      shell: bash
      run: |
        body="$(awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md)"
        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        echo "$body" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "Release $GITHUB_REF_NAME" \
          --notes "${{ steps.changelog.outputs.body }}"