name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Prepare Backend Test Env
      # database.js refuses to boot without ENCRYPTION_KEY (secrets hardening,
      # B5) — generate a throwaway key so tests run without a real .env.
      # (openssl is bundled on all three runner images.)
      shell: bash
      run: |
        cd backend
        echo "ENCRYPTION_KEY=$(openssl rand -hex 16)" > .env
        echo "OPENROUTER_API_KEY=" >> .env
        echo "EVM_PROVIDER_URL=" >> .env

    - name: Run Backend Tests + Coverage
      run: |
        cd backend
        npm run coverage

    - name: Backend Coverage Gate
      # Local quality gate (no external service): fail if the backend drops
      # below the floor. Thresholds sit comfortably under the measured values
      # (lines 81%, statements 79%).
      shell: bash
      run: |
        node scripts/coverage-gate.mjs backend/coverage/coverage-summary.json 70 70 50 65

    - name: Run Backend Lint
      run: |
        cd backend
        npm run lint

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Frontend Tests + Coverage
      run: |
        cd frontend
        npm run coverage

    - name: Frontend Coverage Gate
      shell: bash
      run: |
        node scripts/coverage-gate.mjs frontend/coverage/coverage-summary.json 65 65 60 65

    - name: Run Frontend Lint
      run: |
        cd frontend
        npm run lint

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

  # Browser E2E (Playwright) — runs on Windows because the committed visual
  # regression baselines are chromium-win32 renders; screenshots are not
  # pixel-identical across OSes (font rasterization differs), so the baseline
  # platform must match the runner.
  e2e:
    runs-on: windows-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Prepare Backend Test Env
      shell: bash
      run: |
        cd backend
        echo "ENCRYPTION_KEY=$(openssl rand -hex 16)" > .env
        echo "OPENROUTER_API_KEY=" >> .env

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Install Playwright Chromium
      run: |
        cd frontend
        npx playwright install chromium

    - name: Run Playwright (E2E + visual regression)
      # playwright.config.js boots the backend + frontend dev server itself.
      run: |
        cd frontend
        npx playwright test

    - name: Upload Playwright failure artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e
        path: frontend/test-results
        if-no-files-found: ignore